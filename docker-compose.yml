services:
  upscaler:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CLARITY_IMAGE:-clarity-image-tools:local}
    container_name: clarity-upscaler
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8794}:8794"
    environment:
      MODEL_DIR: /models
      U2NET_HOME: /models/rembg
      STORAGE_DIR: /data/storage
      REDIS_DATA_DIR: /data/redis
      REDIS_URL: redis://127.0.0.1:6379/0
      RQ_QUEUE_NAME: image-jobs
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-1}"
      HISTORY_LIMIT: "${HISTORY_LIMIT:-100}"
      QUEUE_HISTORY_LIMIT: "${QUEUE_HISTORY_LIMIT:-100}"
      BATCH_HISTORY_LIMIT: "${BATCH_HISTORY_LIMIT:-50}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-64}"
      MAX_BATCH_FILES: "${MAX_BATCH_FILES:-100}"
      MAX_BATCH_TOTAL_MB: "${MAX_BATCH_TOTAL_MB:-512}"
      MAX_IMAGE_DIMENSION: "${MAX_IMAGE_DIMENSION:-16384}"
      MAX_INPUT_PIXELS: "${MAX_INPUT_PIXELS:-64000000}"
      MAX_OUTPUT_PIXELS: "${MAX_OUTPUT_PIXELS:-64000000}"
      MAX_VECTOR_PIXELS: "${MAX_VECTOR_PIXELS:-25000000}"
      MAX_LISTING_PACK_PIXELS: "${MAX_LISTING_PACK_PIXELS:-25000000}"
      UPSCALER_DEVICE: "${UPSCALER_DEVICE:-auto}"
      REMBG_DEVICE: "${REMBG_DEVICE:-auto}"
      ENABLE_TENSORRT_PROVIDER: "${ENABLE_TENSORRT_PROVIDER:-false}"
      CLARITY_API_KEY: "${CLARITY_API_KEY:-}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
      APP_PORT: 8794
    volumes:
      - clarity-data:/data
      - upscaler-models:/models

volumes:
  clarity-data:
  upscaler-models:
